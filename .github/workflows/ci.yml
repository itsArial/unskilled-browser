name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libtss2-dev \
            libwayland-dev libxkbcommon-dev libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a ci.log
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee -a ci.log
      # Annotations are readable without access to the logs.
      - name: surface failures
        if: failure()
        shell: bash
        run: |
          grep -E -A3 "^error|panicked|FAILED|failed to run|STATUS_|exit code" ci.log | head -60 |
            while IFS= read -r line; do echo "::error::$line"; done

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/msvc-dev-cmd@v1
      # Git Bash puts its GNU `link` (a file utility) ahead of MSVC's linker on PATH.
      - name: unshadow MSVC's link.exe
        shell: bash
        run: rm -f /usr/bin/link.exe
      - name: ninja
        run: choco install ninja -y --no-progress
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a ci.log
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee -a ci.log
      # The bundle's sandboxed entry: CEF's bootstrap.exe rebranded, and the DLL it loads.
      - name: sandbox entry
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked -p unskilled-winmain 2>&1 | tee -a ci.log
          dll=target/debug/unskilled_winmain.dll
          dumpbin -nologo -exports $dll | grep -w RunWinMain
          exe=$(ls -dt target/debug/build/unskilled-winmain-*/out/unskilled.exe | head -1)
          name=$(powershell -NoProfile -Command "(Get-Item '$exe').VersionInfo.FileDescription" | tr -d '\r')
          echo "unskilled.exe: $name" | tee -a ci.log
          [[ $name == "unskilled browser" ]]
      # The installer, on a stand-in bundle: two versions in a row, then the uninstaller.
      - name: installer
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          set -o pipefail
          bundle="$RUNNER_TEMP/bundle"
          inst="$(cygpath -w "$RUNNER_TEMP/unskilled-install")"
          key='HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\unskilled-browser'
          mkdir -p "$bundle/locales"
          cp "$(ls -dt target/debug/build/unskilled-winmain-*/out/unskilled.exe | head -1)" "$bundle/unskilled.exe"
          cp target/debug/unskilled_winmain.dll "$bundle/unskilled.dll"
          echo test > "$bundle/locales/en-US.pak"
          for v in 0.0.1 0.0.2; do
            makensis -V2 -DVERSION=$v -DBUNDLE="$(cygpath -w "$bundle")" -DOUTFILE="$(cygpath -w "$RUNNER_TEMP/setup-$v.exe")" scripts/installer.nsi
            "$RUNNER_TEMP/setup-$v.exe" /S /D=$inst
          done
          target=$(powershell -NoProfile -Command "(Get-Item '$inst\current').Target" | tr -d '\r')
          echo "current -> $target"
          [[ $target == *'\versions\0.0.2' ]]
          test -f "$inst/current/unskilled.exe" -a -d "$inst/versions/0.0.1"
          reg query "$key" /v DisplayVersion | grep -w 0.0.2
          "$inst/uninstall.exe" /S _?=$inst
          test ! -e "$inst/versions" -a ! -e "$inst/current"
          if reg query "$key" > /dev/null 2>&1; then echo "uninstall left the registry entry"; exit 1; fi
      # The browser has to start: the bundle layout (CEF's bootstrap as unskilled.exe, sandbox on),
      # a throwaway vault unlocked by the debug-only PIN hook, and a page that must load while the
      # browser and its renderers stay up.
      - name: start-up
        shell: bash
        run: |
          cef=$(ls -dt target/debug/build/cef-dll-sys-*/out/cef_windows_x86_64 | head -1)
          mkdir -p run/locales
          cp "$cef"/*.dll "$cef"/*.dat "$cef"/*.bin "$cef"/*.pak "$cef/vk_swiftshader_icd.json" run/
          cp "$cef"/locales/en-US*.pak run/locales/
          cp "$(ls -dt target/debug/build/unskilled-winmain-*/out/unskilled.exe | head -1)" run/unskilled.exe
          cp target/debug/unskilled_winmain.dll run/unskilled.dll
      - name: start-up (run)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\startup-data"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:UNSKILLED_DEV_PIN = "throwaway passphrase"
          $env:UNSKILLED_OPEN = "https://example.com/"
          $env:RUST_LOG = "info,unskilled_engine=debug,wgpu_core=warn,wgpu_hal=warn"
          $dir = (Resolve-Path run).Path
          $log = "$env:RUNNER_TEMP\startup.log"
          $p = Start-Process "$dir\unskilled.exe" -WorkingDirectory $dir -PassThru -RedirectStandardError $log
          $exited = $p.WaitForExit(45000)
          $types = @(Get-CimInstance Win32_Process -Filter "Name='unskilled.exe'" | ForEach-Object { (($_.CommandLine -split ' ') | Where-Object { $_ -like '--type=*' }) -join '' })
          Get-Process unskilled -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content $log
          "processes: browser + $($types -join ', ')"
          $text = Get-Content -Raw $log
          $failure =
            if ($exited) { "the browser exited with code 0x{0:X}" -f $p.ExitCode }
            elseif ($text -notmatch 'chromium sandbox on') { "chromium ran without the sandbox" }
            elseif ($text -notmatch 'engine: loaded https://example.com/') { "the page never loaded" }
            elseif ($text -match 'renderer process ended') { "a renderer process died" }
            elseif ($types -notcontains '--type=renderer') { "no renderer process is running" }
          if ($failure) { "::error::start-up: $failure"; exit 1 }
      # Annotations are readable without access to the logs.
      - name: surface failures
        if: failure()
        shell: bash
        run: |
          grep -E -A3 "^error|panicked|FAILED|failed to run|STATUS_|exit code" ci.log | head -60 |
            while IFS= read -r line; do echo "::error::$line"; done
