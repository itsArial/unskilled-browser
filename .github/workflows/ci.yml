name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libtss2-dev \
            libwayland-dev libxkbcommon-dev libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a ci.log
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee -a ci.log
      # Annotations are readable without access to the logs.
      - name: surface failures
        if: failure()
        shell: bash
        run: |
          grep -E -A3 "^error|panicked|FAILED|failed to run|STATUS_|exit code" ci.log | head -60 |
            while IFS= read -r line; do echo "::error::$line"; done

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: ilammy/msvc-dev-cmd@v1
      # Git Bash puts its GNU `link` (a file utility) ahead of MSVC's linker on PATH.
      - name: unshadow MSVC's link.exe
        shell: bash
        run: rm -f /usr/bin/link.exe
      - name: ninja
        run: choco install ninja -y --no-progress
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a ci.log
      - name: test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee -a ci.log
      # The bundle's sandboxed entry: CEF's bootstrap.exe rebranded, and the DLL it loads.
      - name: sandbox entry
        shell: bash
        run: |
          set -o pipefail
          cargo build --locked -p unskilled-winmain 2>&1 | tee -a ci.log
          dll=target/debug/unskilled_winmain.dll
          dumpbin -nologo -exports $dll | grep -w RunWinMain
          # Sandboxed renderers can't load user32/gdi32: the DLL may only delay-load them.
          deps=$(dumpbin -nologo -dependents $dll | tr -d '\r')
          echo "$deps"
          if echo "$deps" | sed -n '/following dependencies/,/delay load dependencies/p' | grep -iwE "user32|gdi32"; then
            echo "unskilled_winmain.dll loads user32/gdi32 at startup" | tee -a ci.log; exit 1
          fi
          exe=$(ls -dt target/debug/build/unskilled-winmain-*/out/unskilled.exe | head -1)
          name=$(powershell -NoProfile -Command "(Get-Item '$exe').VersionInfo.FileDescription" | tr -d '\r')
          echo "unskilled.exe: $name" | tee -a ci.log
          [[ $name == "unskilled browser" ]]
      # Annotations are readable without access to the logs.
      - name: surface failures
        if: failure()
        shell: bash
        run: |
          grep -E -A3 "^error|panicked|FAILED|failed to run|STATUS_|exit code" ci.log | head -60 |
            while IFS= read -r line; do echo "::error::$line"; done
