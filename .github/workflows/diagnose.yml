name: diagnose

# Temporary: builds the Windows browser and starts it like the bundle does, to fix start-up.
on:
  push:
    branches: [claude/trusting-lamport-dvcfo5]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: unshadow MSVC's link.exe
        shell: bash
        run: rm -f /usr/bin/link.exe
      - name: ninja
        run: choco install ninja -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: build
        shell: bash
        run: cargo build --locked -p unskilled-winmain

      - name: assemble the bundle layout
        shell: bash
        run: |
          cef=$(ls -dt target/debug/build/cef-dll-sys-*/out/cef_windows_x86_64 | head -1)
          mkdir -p run/locales
          cp "$cef"/*.dll "$cef"/*.dat "$cef"/*.bin "$cef"/*.pak "$cef/vk_swiftshader_icd.json" run/
          cp "$cef"/locales/en-US*.pak run/locales/
          cp "$(ls -dt target/debug/build/unskilled-winmain-*/out/unskilled.exe | head -1)" run/unskilled.exe
          cp target/debug/unskilled_winmain.dll run/unskilled.dll
          cp target/debug/unskilled_winmain.pdb run/unskilled_winmain.pdb
          ls run

      - name: start-up
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:UNSKILLED_DEV_PIN = "throwaway passphrase"
          $env:UNSKILLED_OPEN = "https://example.com/"
          $env:RUST_LOG = "info,unskilled_engine=debug,wgpu_core=warn,wgpu_hal=warn"
          $dir = (Resolve-Path run).Path
          $log = "$env:RUNNER_TEMP\startup.txt"
          $p = Start-Process "$dir\unskilled.exe" -WorkingDirectory $dir -PassThru -RedirectStandardError $log
          $exited = $p.WaitForExit(60000)
          Get-CimInstance Win32_Process -Filter "Name='unskilled.exe'" | ForEach-Object { "pid $($_.ProcessId): " + (($_.CommandLine -split ' ') | Where-Object { $_ -like '--type=*' }) }
          Get-Process unskilled -ErrorAction SilentlyContinue | Stop-Process -Force
          "--- log"; Get-Content $log
          if ($exited) { "EXITED with code 0x{0:X}" -f $p.ExitCode; exit 1 }

      - name: under cdb, if it crashes
        if: failure()
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata2"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:UNSKILLED_DEV_PIN = "throwaway passphrase"
          $dir = (Resolve-Path run).Path
          $env:_NT_SYMBOL_PATH = "$dir;srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          Push-Location $dir
          & $cdb -lines -c "g; .lastevent; kn 40; q" "$dir\unskilled.exe" 2>&1 | Select-String -Pattern "violation|exception|Break|^ *[0-9a-f]{2} |ExceptionAddress" | Select-Object -First 70
          Pop-Location
