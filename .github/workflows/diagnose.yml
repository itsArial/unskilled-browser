name: diagnose

# Temporary: runs the published Windows releases on a runner and collects why they exit.
on:
  push:
    branches: [claude/trusting-lamport-dvcfo5]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - name: download
        shell: pwsh
        run: |
          foreach ($v in "0.1.0", "0.2.0") {
            Invoke-WebRequest "https://github.com/itsArial/unskilled-browser/releases/download/v$v/unskilled-browser-$v-windows-x86_64.zip" -OutFile "$v.zip"
            Expand-Archive "$v.zip" -DestinationPath "r$v"
          }

      - name: v0.1.0 (plain exe, no sandbox)
        shell: pwsh
        continue-on-error: true
        run: |
          $dir = (Resolve-Path r0.1.0\unskilled-browser-0.1.0-windows-x86_64).Path
          $env:RUST_LOG = "debug,wgpu_core=warn,wgpu_hal=warn,naga=warn"
          $p = Start-Process "$dir\unskilled.exe" -WorkingDirectory $dir -PassThru -RedirectStandardError "$pwd\v1-stderr.txt"
          if ($p.WaitForExit(30000)) { "EXITED with code $($p.ExitCode) (0x{0:X})" -f $p.ExitCode } else { "STILL RUNNING after 30 s" }
          Get-Process unskilled -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-Content v1-stderr.txt -ErrorAction SilentlyContinue | Select-Object -First 60
          Remove-Item -Recurse -Force "$env:LOCALAPPDATA\unskilled-browser" -ErrorAction SilentlyContinue

      - name: v0.2.0 under cdb
        shell: pwsh
        continue-on-error: true
        run: |
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $cdb) { $cdb = Get-ChildItem -Recurse "C:\Program Files (x86)\Windows Kits" -Filter cdb.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          "cdb: $($cdb.FullName)"
          $dir = (Resolve-Path r0.2.0\unskilled-browser-0.2.0-windows-x86_64).Path
          $env:_NT_SYMBOL_PATH = "srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          Push-Location $dir
          & $cdb.FullName -lines -c "g; .lastevent; .exr -1; r; kn 60; lm o; q" "$dir\unskilled.exe" 2>&1 | Select-Object -Last 150
          Pop-Location
