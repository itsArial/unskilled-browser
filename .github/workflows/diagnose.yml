name: diagnose

# Temporary: builds the Windows browser and starts it like the bundle does, to fix start-up.
on:
  push:
    branches: [claude/trusting-lamport-dvcfo5]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: unshadow MSVC's link.exe
        shell: bash
        run: rm -f /usr/bin/link.exe
      - name: ninja
        run: choco install ninja -y --no-progress
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: build
        shell: bash
        run: cargo build --locked -p unskilled-winmain

      - name: start-up
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:UNSKILLED_DEV_PIN = "throwaway passphrase"
          $env:UNSKILLED_OPEN = "https://example.com/"
          $env:RUST_LOG = "info,unskilled_engine=debug,wgpu_core=warn,wgpu_hal=warn"
          $dir = (Resolve-Path target\debug).Path
          $log = "$env:RUNNER_TEMP\startup.txt"
          $p = Start-Process "$dir\bootstrap.exe" -ArgumentList "--module=unskilled_winmain" -WorkingDirectory $dir -PassThru -RedirectStandardError $log
          $exited = $p.WaitForExit(60000)
          Get-CimInstance Win32_Process -Filter "Name='bootstrap.exe'" | ForEach-Object { "pid $($_.ProcessId): " + (($_.CommandLine -split ' ') | Where-Object { $_ -like '--type=*' }) }
          Get-Process bootstrap -ErrorAction SilentlyContinue | Stop-Process -Force
          "--- log"; Get-Content $log
          if ($exited) { "EXITED with code 0x{0:X}" -f $p.ExitCode }

      - name: under cdb, if it crashes
        if: failure() || success()
        shell: pwsh
        run: |
          $cdb = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\appdata2"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $env:UNSKILLED_DEV_PIN = "throwaway passphrase"
          $dir = (Resolve-Path target\debug).Path
          $env:_NT_SYMBOL_PATH = "$dir;srv*$env:RUNNER_TEMP\sym*https://msdl.microsoft.com/download/symbols"
          Push-Location $dir
          $job = Start-Job { & $using:cdb -lines -c "g; .lastevent; kn 40; q" "$using:dir\bootstrap.exe" --module=unskilled_winmain 2>&1 }
          if (-not (Wait-Job $job -Timeout 60)) { "no crash within 60 s"; Get-Process bootstrap, cdb -ErrorAction SilentlyContinue | Stop-Process -Force }
          Receive-Job $job | Select-String -Pattern "Access violation|exception|^\s*[0-9a-f]{2} |ExceptionAddress" | Select-Object -First 60
          Pop-Location
