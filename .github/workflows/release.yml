name: release

# Push a tag like v0.1.0 to build both bundles and publish them as a GitHub release. Or run it
# by hand on main: it tags that commit with the version in Cargo.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system packages (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config libtss2-dev \
            libwayland-dev libxkbcommon-dev libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Git Bash puts its GNU `link` (a file utility) ahead of MSVC's linker on PATH.
      - name: unshadow MSVC's link.exe (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: rm -f /usr/bin/link.exe
      - name: ninja (windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress
      - name: bundle
        shell: bash
        run: scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: release notes from the changelog
        run: |
          version="${TAG#v}"
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "unskilled browser $TAG" > notes.md
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          # Creates the tag on this commit when the run wasn't started by one.
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "unskilled browser $TAG" \
            --notes-file notes.md $prerelease
