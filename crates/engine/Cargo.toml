[package]
name = "unskilled-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cef = { version = "=156.2.0", features = ["accelerated_osr"] }
shield = { path = "../shield", package = "unskilled-shield" }
profile = { path = "../profile", package = "unskilled-profile" }
wgpu.workspace = true
log.workspace = true
serde_json = "1"
getrandom = "0.4"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
