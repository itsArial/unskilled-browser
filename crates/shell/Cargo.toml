[package]
name = "unskilled"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ui.workspace = true
engine = { path = "../engine", package = "unskilled-engine" }
shield = { path = "../shield", package = "unskilled-shield" }
vault = { path = "../vault", package = "unskilled-vault" }
netinfo = { path = "../netinfo", package = "unskilled-netinfo" }
profile = { path = "../profile", package = "unskilled-profile" }
serde_json = "1"
zeroize = "1"
wgpu.workspace = true
winit.workspace = true
pollster.workspace = true
log.workspace = true
env_logger.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Shutdown",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
